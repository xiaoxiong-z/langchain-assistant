<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Assistant</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 16px}input,button{padding:10px;margin:4px}#chat{min-height:240px;border:1px solid #ddd;padding:12px;white-space:pre-wrap}.hidden{display:none}</style>
<h1>Knowledge Assistant</h1><section id="auth"><input id="user" placeholder="用户名（至少3个字符）"><input id="pass" type="password" placeholder="密码（至少6个字符）"><button onclick="authUser('register')">注册</button><button onclick="authUser('login')">登录</button><p id="msg"></p></section>
<section id="app" class="hidden"><p>已登录：<b id="who"></b> <button onclick="location.reload()">退出</button></p><div id="chat"></div><input id="question" style="width:75%" placeholder="输入问题"><button onclick="ask()">发送</button></section>
<script>let token,session;const userInput=document.getElementById('user'),passInput=document.getElementById('pass');async function authUser(action){let r=await fetch('/api/v1/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:userInput.value.trim(),password:passInput.value})});let d=await r.json();if(!r.ok){msg.textContent=Array.isArray(d.detail)?d.detail.map(x=>x.msg).join('；'):d.detail;return}token=d.access_token;session=d.session_id;who.textContent=d.username;document.getElementById('auth').style.display='none';app.classList.remove('hidden')}async function ask(){let q=question.value;if(!q)return;chat.textContent+='\n你：'+q+'\n';let r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({session_id:session,message:q})});let d=await r.json();chat.textContent+='助手：'+(d.answer||d.detail)+'\n';question.value=''}</script>
